[project]
name = "sales-research-copilot"
version = "0.1.0"
description = "AI Sales Research Copilot — durable, self-correcting LangGraph research workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "tldextract>=5.1",
    "openai>=2.43.0",
    "tavily-python>=0.7.26",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

# This is an application, not a distributable library: uv manages the environment
# and the source lives under `backend/` (added to the path via app-dir / PYTHONPATH),
# so there is no wheel to build.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
